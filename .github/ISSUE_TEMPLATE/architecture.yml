name: Architecture Decision Request
description: Propose a governed architecture decision
title: "Architecture: "
labels: ["type:architecture", "state:draft"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: trigger
    attributes:
      label: Trigger and specification trace
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current architecture
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options and tradeoffs
    validations:
      required: true
  - type: textarea
    id: recommendation
    attributes:
      label: Recommendation
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security, privacy, deployment, and rollback impact
    validations:
      required: true

